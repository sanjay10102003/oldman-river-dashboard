<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alberta Streams Environmental Dashboard</title>

    <link
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>

    <link href="assets/css/main.css" rel="stylesheet" />
  </head>

  <body>
    <!--
      The page markup is built from components in assets/js/components/.
      Scripts are plain (non-module) files that share one global scope, so
      their order matters: each file may only use what is loaded above it
      at load time. main.js must stay last.
    -->

    <!-- Configuration -->
    <script src="assets/js/config/constants.js"></script>
    <script src="assets/js/config/layer-definitions.js"></script>
    <script src="assets/js/config/fish-palette.js"></script>
    <script src="assets/js/config/map-style.js"></script>
    <script src="assets/js/config/ui-options.js"></script>
    <script src="assets/js/config/data-sources.js"></script>

    <!-- Utilities -->
    <script src="assets/js/utils/date.js"></script>
    <script src="assets/js/utils/html.js"></script>
    <script src="assets/js/utils/csv.js"></script>

    <!-- UI components -->
    <script src="assets/js/components/ui.js"></script>
    <script src="assets/js/components/sidebar/layer-selection-card.js"></script>
    <script src="assets/js/components/sidebar/river-controls-card.js"></script>
    <script src="assets/js/components/sidebar/environment-controls-card.js"></script>
    <script src="assets/js/components/sidebar/history-controls-card.js"></script>
    <script src="assets/js/components/sidebar/fish-controls-card.js"></script>
    <script src="assets/js/components/sidebar/ml-results-card.js"></script>
    <script src="assets/js/components/sidebar/summary-card.js"></script>
    <script src="assets/js/components/sidebar/add-data-card.js"></script>
    <script src="assets/js/components/sidebar/sources-card.js"></script>
    <script src="assets/js/components/sidebar/sidebar.js"></script>
    <script src="assets/js/components/map/map-canvas.js"></script>
    <script src="assets/js/components/map/legend-panel.js"></script>
    <script src="assets/js/components/app-shell.js"></script>

    <!-- Core: render the page, state, DOM references, map -->
    <script src="assets/js/core/render-app.js"></script>
    <script src="assets/js/core/state.js"></script>
    <script src="assets/js/core/dom.js"></script>
    <script src="assets/js/core/map.js"></script>

    <!-- Features -->
    <script src="assets/js/features/layer-selection.js"></script>
    <script src="assets/js/features/layer-visibility.js"></script>
    <script src="assets/js/features/basemap.js"></script>
    <script src="assets/js/features/river.js"></script>
    <script src="assets/js/features/environment/live-weather.js"></script>
    <script src="assets/js/features/environment/history.js"></script>
    <script src="assets/js/features/environment/points.js"></script>
    <script src="assets/js/features/environment/environment-controls.js"></script>
    <script src="assets/js/features/selection-box.js"></script>
    <script src="assets/js/features/fish/colors.js"></script>
    <script src="assets/js/features/fish/layer.js"></script>
    <script src="assets/js/features/fish/filters.js"></script>
    <script src="assets/js/features/fish/statistics.js"></script>
    <script src="assets/js/features/fish/species-selector.js"></script>
    <script src="assets/js/features/fish/popup.js"></script>
    <script src="assets/js/features/fish/timeline.js"></script>
    <script src="assets/js/features/ml-results.js"></script>

    <!-- UI behaviour -->
    <script src="assets/js/ui/legend.js"></script>
    <script src="assets/js/ui/summary.js"></script>
    <script src="assets/js/ui/panels.js"></script>

    <!-- Entry point (must stay last) -->
    <script src="assets/js/main.js"></script>
  </body>
</html>
