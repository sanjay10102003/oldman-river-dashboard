<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alberta Streams Temperature Overlay</title>

    <link
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      #map {
        width: 100%;
        height: 100%;
      }

      #status {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 10;
        background: white;
        padding: 12px 16px;
        border-radius: 10px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      }

      #legend {
        position: absolute;
        right: 15px;
        bottom: 25px;
        z-index: 10;
        background: white;
        padding: 14px;
        border-radius: 10px;
        font-family: Arial, sans-serif;
        font-size: 13px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      }

      .legend-row {
        display: flex;
        align-items: center;
        margin-top: 7px;
      }

      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        margin-right: 8px;
      }

      .maplibregl-ctrl-logo {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div id="status">Loading map...</div>
    <div id="map"></div>

    <div id="legend">
      <strong>Live Temperature</strong>
      <div class="legend-row">
        <span class="dot" style="background: #2b83ba"></span>Low / Cold (&lt;
        5°C)
      </div>
      <div class="legend-row">
        <span class="dot" style="background: #ffffbf"></span>Normal (5°C - 15°C)
      </div>
      <div class="legend-row">
        <span class="dot" style="background: #d7191c"></span>High / Warm (&gt;
        15°C)
      </div>
    </div>

    <script>
      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol("pmtiles", protocol.tile);

      const map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          sources: {
            osm: {
              type: "raster",
              tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
              tileSize: 256,
            },
            streams: {
              type: "vector",
              url: "pmtiles://data/alberta_stream_branches.pmtiles",
            },
          },
          layers: [
            {
              id: "osm-basemap",
              type: "raster",
              source: "osm",
            },
            {
              id: "streams-line",
              type: "line",
              source: "streams",
              "source-layer": "streams",
              paint: {
                "line-color": "#0088ff",
                "line-width": [
                  "interpolate",
                  ["linear"],
                  ["zoom"],
                  5,
                  0.3,
                  8,
                  0.8,
                  10,
                  1.5,
                  12,
                  3,
                ],
              },
            },
          ],
        },
        center: [-114.5, 54.5],
        zoom: 5,
      });

      map.addControl(new maplibregl.NavigationControl(), "top-right");

      function randomSample(array, count) {
        const copy = [...array];

        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }

        return copy.slice(0, count);
      }

      function getCategory(temp) {
        if (temp < 5) return "Low / Cold";
        if (temp <= 15) return "Normal";
        return "High / Warm";
      }

      async function loadRandomTemperaturePoints() {
        const status = document.getElementById("status");

        try {
          status.textContent = "Reading stream coordinates...";

          const geojsonResponse = await fetch(
            "data/alberta_stream_branches.geojson",
          );
          const geojson = await geojsonResponse.json();

          let coords = [];

          geojson.features.forEach((feature) => {
            const geometry = feature.geometry;
            if (!geometry) return;

            if (geometry.type === "LineString") {
              coords.push(...geometry.coordinates);
            }

            if (geometry.type === "MultiLineString") {
              geometry.coordinates.forEach((line) => {
                coords.push(...line);
              });
            }
          });

          const unique = [];
          const seen = new Set();

          coords.forEach((coord) => {
            const lon = coord[0];
            const lat = coord[1];

            if (!lon || !lat) return;

            const key = `${lon.toFixed(5)},${lat.toFixed(5)}`;

            if (!seen.has(key)) {
              seen.add(key);
              unique.push({ lon, lat });
            }
          });

          const samplePoints = randomSample(unique, 250);

          status.textContent = `Fetching live temperature for ${samplePoints.length} points...`;

          const tempFeatures = [];
          const chunkSize = 50;

          for (let i = 0; i < samplePoints.length; i += chunkSize) {
            const chunk = samplePoints.slice(i, i + chunkSize);

            const latitudes = chunk.map((p) => p.lat).join(",");
            const longitudes = chunk.map((p) => p.lon).join(",");

            const weatherUrl =
              `https://api.open-meteo.com/v1/forecast` +
              `?latitude=${latitudes}` +
              `&longitude=${longitudes}` +
              `&current=temperature_2m` +
              `&temperature_unit=celsius`;

            const response = await fetch(weatherUrl);
            const data = await response.json();

            chunk.forEach((point, index) => {
              const temp = Array.isArray(data)
                ? data[index]?.current?.temperature_2m
                : data.current?.temperature_2m;

              if (temp === undefined || temp === null) return;

              tempFeatures.push({
                type: "Feature",
                geometry: {
                  type: "Point",
                  coordinates: [point.lon, point.lat],
                },
                properties: {
                  temperature: temp,
                  category: getCategory(temp),
                  source: "Open-Meteo",
                },
              });
            });
          }

          map.addSource("temperature-points", {
            type: "geojson",
            data: {
              type: "FeatureCollection",
              features: tempFeatures,
            },
          });

          map.addLayer({
            id: "temperature-circles",
            type: "circle",
            source: "temperature-points",
            paint: {
              "circle-radius": [
                "interpolate",
                ["linear"],
                ["zoom"],
                4,
                8,
                7,
                14,
                10,
                22,
              ],
              "circle-color": [
                "interpolate",
                ["linear"],
                ["get", "temperature"],
                -15,
                "#2b83ba",
                0,
                "#abdda4",
                10,
                "#ffffbf",
                20,
                "#fdae61",
                30,
                "#d7191c",
              ],
              "circle-stroke-color": "#ffffff",
              "circle-stroke-width": 1,
            },
          });

          map.on("click", "temperature-circles", (e) => {
            const feature = e.features[0];
            const coordinates = feature.geometry.coordinates.slice();
            const temperature = feature.properties.temperature;
            const category = feature.properties.category;
            const source = feature.properties.source;

            new maplibregl.Popup()
              .setLngLat(coordinates)
              .setHTML(
                `
          <div style="font-family: Arial; min-width: 180px;">
            <h3 style="margin:0 0 8px;">Temperature Point</h3>
            <strong>Temperature:</strong> ${temperature}°C<br>
            <strong>Category:</strong> ${category}<br>
            <strong>Latitude:</strong> ${coordinates[1].toFixed(5)}<br>
            <strong>Longitude:</strong> ${coordinates[0].toFixed(5)}<br>
          </div>
        `,
              )
              .addTo(map);
          });

          map.on("mouseenter", "temperature-circles", () => {
            map.getCanvas().style.cursor = "pointer";
          });

          map.on("mouseleave", "temperature-circles", () => {
            map.getCanvas().style.cursor = "";
          });

          status.textContent = `Loaded ${tempFeatures.length} live temperature points`;
        } catch (error) {
          console.error(error);
          status.textContent = "Error loading temperature data";
        }
      }

      map.on("load", () => {
        status.textContent = "Map loaded. Loading temperature...";
        loadRandomTemperaturePoints();
      });
    </script>
  </body>
</html>
