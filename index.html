<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alberta Stream Network</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
        background: #081b2f;
      }

      .dashboard {
        display: grid;
        grid-template-columns: 350px 1fr;
        height: 100vh;
      }

      .sidebar {
        background: linear-gradient(180deg, #0f2742, #102d4d);
        color: white;
        padding: 24px;
        overflow-y: auto;
      }

      h1 {
        margin: 0;
        font-size: 28px;
      }

      .subtitle {
        color: #c9d8e8;
        font-size: 14px;
        line-height: 1.5;
        margin-top: 10px;
      }

      .card {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 22px;
        padding: 22px;
        margin-top: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .card h3 {
        margin-top: 0;
        font-size: 18px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        font-size: 14px;
      }

      .legend-line {
        width: 32px;
        height: 4px;
        background: #2563eb;
        border-radius: 4px;
      }

      .status {
        color: #d5e7ff;
        line-height: 1.6;
        font-size: 14px;
      }

      .progress-wrap {
        width: 100%;
        height: 10px;
        background: rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        margin-top: 12px;
        overflow: hidden;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        background: white;
        transition: width 0.2s ease;
      }

      .map-area {
        position: relative;
        height: 100vh;
      }

      #map {
        width: 100%;
        height: 100%;
      }

      .badge {
        position: absolute;
        top: 18px;
        right: 18px;
        z-index: 1000;
        background: white;
        padding: 14px 18px;
        border-radius: 16px;
        font-weight: bold;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
      }

      .map-loader {
        position: absolute;
        inset: 0;
        background: rgba(8, 27, 47, 0.78);
        z-index: 2000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 18px;
        color: white;
        font-size: 18px;
        font-weight: 600;
        text-align: center;
      }

      .map-loader.hidden {
        display: none;
      }

      .map-spinner {
        width: 70px;
        height: 70px;
        border: 6px solid rgba(255, 255, 255, 0.22);
        border-top: 6px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .map-loader-text {
        max-width: 420px;
        line-height: 1.5;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 900px) {
        .dashboard {
          grid-template-columns: 1fr;
        }

        .map-area {
          height: 70vh;
        }
      }
    </style>
  </head>

  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <h1>Alberta Stream Network</h1>

        <div class="subtitle">
          Stream and river branches are loaded from GeoJSON in batches to avoid
          browser freezing.
        </div>

        <div class="card">
          <h3>Legend</h3>
          <div class="legend-item">
            <span class="legend-line"></span>
            River / Stream Branches
          </div>
        </div>

        <div class="card">
          <h3>Status</h3>
          <div class="status" id="statusText">Preparing map...</div>
          <div class="progress-wrap">
            <div class="progress-bar" id="progressBar"></div>
          </div>
        </div>
      </aside>

      <main class="map-area">
        <div class="badge">Alberta Stream Branches</div>

        <div id="mapLoader" class="map-loader">
          <div class="map-spinner"></div>
          <div class="map-loader-text" id="mapLoaderText">
            Loading Alberta stream network...
          </div>
        </div>

        <div id="map"></div>
      </main>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
      const GEOJSON_FILE = "./data/alberta_stream_branches.geojson";

      const BATCH_SIZE = 500;

      const map = L.map("map", {
        preferCanvas: true,
        zoomAnimation: false,
        fadeAnimation: false,
        markerZoomAnimation: false,
      }).setView([53.5, -114.5], 6);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors",
        maxZoom: 19,
      }).addTo(map);

      const streamLayerGroup = L.layerGroup().addTo(map);

      const statusText = document.getElementById("statusText");
      const progressBar = document.getElementById("progressBar");
      const mapLoader = document.getElementById("mapLoader");
      const mapLoaderText = document.getElementById("mapLoaderText");

      function updateProgress(done, total) {
        const percent = total === 0 ? 0 : Math.round((done / total) * 100);
        progressBar.style.width = `${percent}%`;

        statusText.textContent = `Rendering stream features (${percent}%)...`;

        mapLoaderText.textContent = `Rendering stream network... ${percent}%`;
      }

      function addFeatureBatch(features, index, total, bounds) {
        const end = Math.min(index + BATCH_SIZE, total);

        for (let i = index; i < end; i++) {
          const featureLayer = L.geoJSON(features[i], {
            style: {
              color: "#2563eb",
              weight: 0.5,
              opacity: 0.75,
              interactive: false,
            },
          });

          streamLayerGroup.addLayer(featureLayer);

          const featureBounds = featureLayer.getBounds();
          if (featureBounds.isValid()) {
            bounds.extend(featureBounds);
          }
        }

        updateProgress(end, total);

        if (end < total) {
          setTimeout(() => {
            addFeatureBatch(features, end, total, bounds);
          }, 0);
        } else {
          if (bounds.isValid()) {
            map.fitBounds(bounds);
          }

          statusText.textContent = `Loaded stream successfully.`;

          mapLoader.classList.add("hidden");
        }
      }

      async function loadGeoJSON() {
        try {
          mapLoader.classList.remove("hidden");
          mapLoaderText.textContent = "Downloading GeoJSON file...";
          statusText.textContent = "Downloading GeoJSON file...";
          progressBar.style.width = "0%";

          const response = await fetch(GEOJSON_FILE);

          if (!response.ok) {
            throw new Error("Could not load GeoJSON file.");
          }

          mapLoaderText.textContent = "Parsing GeoJSON coordinates...";
          statusText.textContent = "Parsing GeoJSON coordinates...";

          const data = await response.json();

          if (!data.features || data.features.length === 0) {
            throw new Error("GeoJSON has no features.");
          }

          streamLayerGroup.clearLayers();

          const bounds = L.latLngBounds([]);

          addFeatureBatch(data.features, 0, data.features.length, bounds);
        } catch (error) {
          console.error(error);

          statusText.textContent =
            "Error loading data/alberta_stream_branches.geojson. Make sure the file exists inside the data folder.";

          mapLoaderText.textContent =
            "Error loading stream network. Check the file path and file size.";

          progressBar.style.width = "0%";

          setTimeout(() => {
            mapLoader.classList.add("hidden");
          }, 2500);
        }
      }

      loadGeoJSON();
    </script>
  </body>
</html>
