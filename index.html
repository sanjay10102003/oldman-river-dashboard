<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oldman River Environmental Dashboard</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
        background: #081b2f;
      }

      * {
        box-sizing: border-box;
      }

      .dashboard {
        display: grid;
        grid-template-columns: 350px 1fr;
        height: 100vh;
      }

      .sidebar {
        background: linear-gradient(180deg, #0f2742, #102d4d);
        color: white;
        padding: 24px;
        overflow-y: auto;
      }

      h1 {
        margin: 0;
        font-size: 28px;
      }

      .subtitle {
        color: #c9d8e8;
        font-size: 14px;
        line-height: 1.5;
        margin-top: 10px;
      }

      .card {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 22px;
        padding: 22px;
        margin-top: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .card h3 {
        margin-top: 0;
        font-size: 18px;
      }

      label {
        display: block;
        margin-bottom: 10px;
        font-size: 15px;
        font-weight: bold;
      }

      select,
      input[type="date"],
      input[type="range"] {
        width: 100%;
        padding: 14px;
        border-radius: 14px;
        border: none;
        font-size: 15px;
        margin-bottom: 18px;
      }

      input[type="range"] {
        padding: 0;
      }

      .date-display {
        color: #dcecff;
        font-size: 15px;
      }

      .date-display strong {
        color: white;
        font-size: 19px;
      }

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .stat-box {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 16px;
        min-height: 78px;
      }

      .stat-value {
        font-size: 22px;
        font-weight: bold;
        word-break: break-word;
        min-height: 28px;
        display: flex;
        align-items: center;
      }

      .stat-label {
        color: #c9d8e8;
        font-size: 13px;
        margin-top: 5px;
      }

      .loader {
        width: 22px;
        height: 22px;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top: 3px solid white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        font-size: 14px;
      }

      .legend-color {
        width: 18px;
        height: 18px;
        border-radius: 50%;
      }

      .status {
        color: #d5e7ff;
        line-height: 1.6;
        font-size: 14px;
      }

      .map-area {
        position: relative;
        height: 100vh;
      }

      #map {
        width: 100%;
        height: 100%;
      }

      .badge {
        position: absolute;
        top: 18px;
        right: 18px;
        z-index: 1000;
        background: white;
        padding: 14px 18px;
        border-radius: 16px;
        font-weight: bold;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
      }

      .small-text {
        color: #c9d8e8;
        font-size: 13px;
        margin-top: -8px;
        margin-bottom: 14px;
      }

      @media (max-width: 900px) {
        .dashboard {
          grid-template-columns: 1fr;
        }

        .map-area {
          height: 70vh;
        }
      }
    </style>
  </head>

  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <h1>Oldman River Dashboard</h1>

        <p class="subtitle">
          Visualize historical environmental conditions and trout habitat
          suitability along the Oldman River.
        </p>

        <div class="card">
          <h3>Layer Control</h3>

          <label>Select Layer</label>
          <select id="layerSelect">
            <option value="temperature">Temperature</option>
            <option value="precipitation">Precipitation</option>
            <option value="wind">Wind Speed</option>
            <option value="humidity">Humidity</option>
            <option value="pressure">Pressure</option>
            <option value="model">Trout Habitat Suitability Model</option>
          </select>

          <label>Select Date</label>
          <input type="date" id="datePicker" />

          <label id="modelFilterLabel" style="display: none"
            >Model Suitability Filter</label
          >
          <select id="modelFilter" style="display: none">
            <option value="All">All</option>
            <option value="High">High Only</option>
            <option value="Moderate">Moderate Only</option>
            <option value="Low">Low Only</option>
          </select>

          <label>Marker Size</label>
          <input type="range" id="markerSize" min="2" max="18" value="4" />
          <div class="small-text">
            Current size: <span id="markerSizeText">4</span>
          </div>

          <div class="date-display">
            Selected Date:
            <br />
            <strong id="selectedDate">Loading...</strong>
          </div>
        </div>

        <div class="card">
          <h3>Summary</h3>

          <div class="stats">
            <div class="stat-box">
              <div class="stat-value" id="avgValue">--</div>
              <div class="stat-label" id="avgLabel">Average</div>
            </div>

            <div class="stat-box">
              <div class="stat-value" id="pointCount">--</div>
              <div class="stat-label">Points</div>
            </div>

            <div class="stat-box">
              <div class="stat-value" id="minValue">--</div>
              <div class="stat-label" id="minLabel">Minimum</div>
            </div>

            <div class="stat-box">
              <div class="stat-value" id="maxValue">--</div>
              <div class="stat-label" id="maxLabel">Maximum</div>
            </div>
          </div>
        </div>

        <div class="card">
          <h3>Legend</h3>
          <div id="legendBox"></div>
        </div>

        <div class="card">
          <h3>Status</h3>
          <div class="status" id="statusText">Loading river data...</div>
        </div>
      </aside>

      <main class="map-area">
        <div class="badge" id="mapBadge">Oldman River Layer</div>
        <div id="map"></div>
      </main>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
      const map = L.map("map").setView([49.7, -112.8], 8);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors",
        maxZoom: 19,
      }).addTo(map);

      let riverCoordinates = [];
      let overlayLayers = [];
      let modelData = null;
      let modelDates = [];
      let currentRequestId = 0;

      const layerSelect = document.getElementById("layerSelect");
      const datePicker = document.getElementById("datePicker");
      const selectedDateText = document.getElementById("selectedDate");
      const statusText = document.getElementById("statusText");
      const mapBadge = document.getElementById("mapBadge");

      const avgValue = document.getElementById("avgValue");
      const minValue = document.getElementById("minValue");
      const maxValue = document.getElementById("maxValue");
      const pointCount = document.getElementById("pointCount");

      const avgLabel = document.getElementById("avgLabel");
      const minLabel = document.getElementById("minLabel");
      const maxLabel = document.getElementById("maxLabel");

      const legendBox = document.getElementById("legendBox");
      const markerSize = document.getElementById("markerSize");
      const markerSizeText = document.getElementById("markerSizeText");
      const modelFilter = document.getElementById("modelFilter");
      const modelFilterLabel = document.getElementById("modelFilterLabel");

      const layerConfig = {
        temperature: {
          label: "Temperature",
          unit: "°C",
          api: "temperature_2m_mean",
          type: "daily",
        },
        precipitation: {
          label: "Precipitation",
          unit: "mm",
          api: "precipitation_sum",
          type: "daily",
        },
        wind: {
          label: "Wind Speed",
          unit: "km/h",
          api: "wind_speed_10m_max",
          type: "daily",
        },
        humidity: {
          label: "Humidity",
          unit: "%",
          api: "relative_humidity_2m",
          type: "hourly",
        },
        pressure: {
          label: "Pressure",
          unit: "hPa",
          api: "surface_pressure",
          type: "hourly",
        },
      };

      function setupDatePickerForEnvironmental() {
        const today = new Date();
        const pastDate = new Date();

        pastDate.setFullYear(today.getFullYear() - 20);

        const maxDate = today.toISOString().split("T")[0];
        const minDate = pastDate.toISOString().split("T")[0];

        datePicker.min = minDate;
        datePicker.max = maxDate;

        if (
          !datePicker.value ||
          datePicker.value < minDate ||
          datePicker.value > maxDate
        ) {
          datePicker.value = maxDate;
        }

        selectedDateText.textContent = datePicker.value;
      }

      async function setupDatePickerForModel() {
        await loadModelData();

        if (!modelDates.length) return;

        const minDate = modelDates[0];
        const maxDate = modelDates[modelDates.length - 1];

        datePicker.min = minDate;
        datePicker.max = maxDate;

        if (
          !datePicker.value ||
          datePicker.value < minDate ||
          datePicker.value > maxDate
        ) {
          datePicker.value = minDate;
        }

        selectedDateText.textContent = datePicker.value;
      }

      function clearMapOverlay() {
        overlayLayers.forEach((layer) => {
          map.removeLayer(layer);
        });

        overlayLayers = [];
      }

      function showSummaryLoader() {
        avgValue.innerHTML = `<div class="loader"></div>`;
        minValue.innerHTML = `<div class="loader"></div>`;
        maxValue.innerHTML = `<div class="loader"></div>`;
        pointCount.innerHTML = `<div class="loader"></div>`;
      }

      function average(arr) {
        if (!arr.length) return 0;
        return arr.reduce((a, b) => a + b, 0) / arr.length;
      }

      function getMarkerRadius(score = 0.5) {
        const base = Number(markerSize.value);
        const safeScore = Number.isFinite(Number(score)) ? Number(score) : 0.5;

        if (layerSelect.value === "model") {
          return base + safeScore * 5;
        }

        return base;
      }

      function getEnvironmentalColor(value, layer) {
        if (layer === "temperature") {
          if (value < 10) return "#22c55e";
          if (value < 18) return "#f59e0b";
          return "#ef4444";
        }

        if (layer === "precipitation") {
          if (value < 2) return "#22c55e";
          if (value < 10) return "#f59e0b";
          return "#ef4444";
        }

        if (layer === "wind") {
          if (value < 15) return "#22c55e";
          if (value < 30) return "#f59e0b";
          return "#ef4444";
        }

        if (layer === "humidity") {
          if (value < 50) return "#22c55e";
          if (value < 75) return "#f59e0b";
          return "#ef4444";
        }

        if (layer === "pressure") {
          if (value < 1000) return "#ef4444";
          if (value < 1020) return "#f59e0b";
          return "#22c55e";
        }

        return "#2684ff";
      }

      function getSuitabilityColor(level) {
        if (level === "High") return "#22c55e";
        if (level === "Moderate") return "#f59e0b";
        return "#ef4444";
      }

      function updateEnvironmentalLegend(config) {
        let lowText = "";
        let mediumText = "";
        let highText = "";

        if (config.label === "Temperature") {
          lowText = "< 10°C";
          mediumText = "10°C - 18°C";
          highText = "> 18°C";
        } else if (config.label === "Precipitation") {
          lowText = "< 2 mm";
          mediumText = "2 mm - 10 mm";
          highText = "> 10 mm";
        } else if (config.label === "Wind Speed") {
          lowText = "< 15 km/h";
          mediumText = "15 - 30 km/h";
          highText = "> 30 km/h";
        } else if (config.label === "Humidity") {
          lowText = "< 50%";
          mediumText = "50% - 75%";
          highText = "> 75%";
        } else if (config.label === "Pressure") {
          lowText = "< 1000 hPa";
          mediumText = "1000 - 1020 hPa";
          highText = "> 1020 hPa";
        }

        legendBox.innerHTML = `
          <div class="legend-item">
            <span class="legend-color" style="background:#22c55e"></span>
            Low ${config.label} (${lowText})
          </div>

          <div class="legend-item">
            <span class="legend-color" style="background:#f59e0b"></span>
            Medium ${config.label} (${mediumText})
          </div>

          <div class="legend-item">
            <span class="legend-color" style="background:#ef4444"></span>
            High ${config.label} (${highText})
          </div>
        `;
      }

      function updateModelLegend() {
        legendBox.innerHTML = `
          <div class="legend-item">
            <span class="legend-color" style="background:#22c55e"></span>
            High Suitability (score > 0.7)
          </div>

          <div class="legend-item">
            <span class="legend-color" style="background:#f59e0b"></span>
            Moderate Suitability (0.4 - 0.7)
          </div>

          <div class="legend-item">
            <span class="legend-color" style="background:#ef4444"></span>
            Low Suitability (score < 0.4)
          </div>
        `;
      }

      function updateEnvironmentalStats(values, unit) {
        avgLabel.textContent = "Average";
        minLabel.textContent = "Minimum";
        maxLabel.textContent = "Maximum";

        if (!values.length) {
          avgValue.textContent = "--";
          minValue.textContent = "--";
          maxValue.textContent = "--";
          pointCount.textContent = "0";
          return;
        }

        avgValue.textContent = average(values).toFixed(1) + unit;
        minValue.textContent = Math.min(...values).toFixed(1) + unit;
        maxValue.textContent = Math.max(...values).toFixed(1) + unit;
        pointCount.textContent = values.length;
      }

      function updateModelStats(features) {
        const allForDate = modelData.features.filter((feature) => {
          return feature.properties.date === datePicker.value;
        });

        const selectedLevel = modelFilter.value;

        avgLabel.textContent = "Avg Score";
        minLabel.textContent = "High";
        maxLabel.textContent = "Low";

        if (!features.length) {
          avgValue.textContent = "--";
          minValue.textContent = "0";
          maxValue.textContent = "0";
          pointCount.textContent = "0";
          return;
        }

        const scores = features.map((feature) => {
          return Number(feature.properties.suitability_score || 0);
        });

        const highCount = allForDate.filter((feature) => {
          const level =
            feature.properties.visual_level ||
            feature.properties.suitability_level;
          return level === "High";
        }).length;

        const lowCount = allForDate.filter((feature) => {
          const level =
            feature.properties.visual_level ||
            feature.properties.suitability_level;
          return level === "Low";
        }).length;

        avgValue.textContent = average(scores).toFixed(2);
        minValue.textContent = highCount;
        maxValue.textContent = lowCount;

        if (selectedLevel === "All") {
          pointCount.textContent = features.length;
        } else {
          pointCount.textContent = `${features.length} ${selectedLevel}`;
        }
      }

      async function fetchEnvironmentalValue(
        lat,
        lon,
        date,
        layerKey,
        requestId,
      ) {
        if (requestId !== currentRequestId) return null;

        const config = layerConfig[layerKey];

        let url =
          "https://archive-api.open-meteo.com/v1/archive" +
          `?latitude=${lat}` +
          `&longitude=${lon}` +
          `&start_date=${date}` +
          `&end_date=${date}` +
          `&timezone=auto`;

        if (config.type === "daily") {
          url += `&daily=${config.api}`;
        } else {
          url += `&hourly=${config.api}`;
        }

        const response = await fetch(url);

        if (requestId !== currentRequestId) return null;

        const data = await response.json();

        if (requestId !== currentRequestId) return null;

        if (config.type === "daily") {
          return data.daily?.[config.api]?.[0] ?? null;
        }

        const values = (data.hourly?.[config.api] || []).filter(
          (v) => v !== null,
        );
        return values.length ? average(values) : null;
      }

      async function loadEnvironmentalLayer(requestId) {
        clearMapOverlay();
        showSummaryLoader();

        const layerKey = layerSelect.value;
        const config = layerConfig[layerKey];
        const date = datePicker.value;

        selectedDateText.textContent = date;
        mapBadge.textContent = `Oldman River ${config.label}`;
        statusText.textContent = `Loading ${config.label.toLowerCase()} layer...`;

        updateEnvironmentalLegend(config);

        const values = [];
        const step = Math.max(1, Math.floor(riverCoordinates.length / 25));

        for (let i = 0; i < riverCoordinates.length; i += step) {
          if (requestId !== currentRequestId) return;

          const [lon, lat] = riverCoordinates[i];

          try {
            const value = await fetchEnvironmentalValue(
              lat,
              lon,
              date,
              layerKey,
              requestId,
            );

            if (requestId !== currentRequestId) return;

            if (value === null || value === undefined || isNaN(value)) {
              continue;
            }

            values.push(value);

            const color = getEnvironmentalColor(value, layerKey);

            const marker = L.circleMarker([lat, lon], {
              radius: getMarkerRadius(),
              color: color,
              fillColor: color,
              fillOpacity: 0.85,
              weight: 2,
            }).addTo(map).bindPopup(`
            <b>${config.label}</b><br>
            Date: ${date}<br>
            Value: <b>${value.toFixed(1)} ${config.unit}</b><br>
            Latitude: ${lat.toFixed(4)}<br>
            Longitude: ${lon.toFixed(4)}
          `);

            overlayLayers.push(marker);
          } catch (error) {
            if (requestId !== currentRequestId) return;
            console.error(error);
          }
        }

        if (requestId !== currentRequestId) return;

        updateEnvironmentalStats(values, config.unit);
        statusText.textContent = `${config.label} layer loaded successfully.`;
      }

      async function loadModelData() {
        if (modelData) return;

        const response = await fetch("./data/habitat_suitability.geojson");

        if (!response.ok) {
          throw new Error("habitat_suitability.geojson not found");
        }

        modelData = await response.json();

        modelDates = [
          ...new Set(modelData.features.map((f) => f.properties.date)),
        ].sort();
      }

      async function loadModelLayer(requestId) {
        clearMapOverlay();
        showSummaryLoader();

        try {
          await setupDatePickerForModel();

          if (requestId !== currentRequestId) return;

          const date = datePicker.value;
          const selectedLevel = modelFilter.value;

          selectedDateText.textContent = date;
          mapBadge.textContent = "Trout Habitat Suitability";
          statusText.textContent = "Loading model output layer...";

          updateModelLegend();

          const selectedFeatures = modelData.features.filter((feature) => {
            const p = feature.properties;
            const level = p.visual_level || p.suitability_level || "Low";

            const dateMatch = p.date === date;
            const levelMatch =
              selectedLevel === "All" || level === selectedLevel;

            return dateMatch && levelMatch;
          });

          selectedFeatures.forEach((feature) => {
            if (requestId !== currentRequestId) return;

            const p = feature.properties;
            const [lon, lat] = feature.geometry.coordinates;

            const level = p.visual_level || p.suitability_level || "Low";
            const color = getSuitabilityColor(level);
            const score = Number(p.suitability_score || 0);

            const marker = L.circleMarker([lat, lon], {
              radius: getMarkerRadius(score),
              color: color,
              fillColor: color,
              fillOpacity: 0.88,
              weight: 2,
            }).addTo(map).bindPopup(`
            <b>Trout Habitat Suitability</b><br>
            Date: ${p.date}<br>
            Suitability: <b>${level}</b><br>
            Score: <b>${score.toFixed(3)}</b><br>
            Temperature: ${p.temperature} °C<br>
            Elevation: ${p.elevation} m<br>
            Precipitation: ${p.precipitation} mm<br>
            Latitude: ${lat.toFixed(4)}<br>
            Longitude: ${lon.toFixed(4)}
          `);

            overlayLayers.push(marker);
          });

          if (requestId !== currentRequestId) return;

          updateModelStats(selectedFeatures);

          if (selectedLevel === "All") {
            statusText.textContent = `Model output loaded for ${date}.`;
          } else {
            statusText.textContent = `Model output loaded for ${date}: ${selectedLevel} suitability only.`;
          }
        } catch (error) {
          if (requestId !== currentRequestId) return;

          console.error(error);
          statusText.textContent =
            "Error loading habitat_suitability.geojson. Run the model first.";
        }
      }

      async function loadSelectedLayer() {
        const requestId = ++currentRequestId;

        clearMapOverlay();

        const isModel = layerSelect.value === "model";

        modelFilter.style.display = isModel ? "block" : "none";
        modelFilterLabel.style.display = isModel ? "block" : "none";

        if (isModel) {
          await loadModelLayer(requestId);
        } else {
          setupDatePickerForEnvironmental();
          await loadEnvironmentalLayer(requestId);
        }
      }

      function extractRiverCoordinates(data) {
        riverCoordinates = [];

        data.features.forEach((feature) => {
          if (!feature.geometry) return;

          if (feature.geometry.type === "LineString") {
            feature.geometry.coordinates.forEach((coord) => {
              riverCoordinates.push(coord);
            });
          }

          if (feature.geometry.type === "MultiLineString") {
            feature.geometry.coordinates.forEach((line) => {
              line.forEach((coord) => {
                riverCoordinates.push(coord);
              });
            });
          }
        });
      }

      setupDatePickerForEnvironmental();

      fetch("./data/oldman_river.geojson")
        .then((response) => {
          if (!response.ok) {
            throw new Error("GeoJSON not found");
          }

          return response.json();
        })
        .then(async (data) => {
          const riverLayer = L.geoJSON(data, {
            style: {
              color: "#2684ff",
              weight: 5,
              opacity: 0.9,
            },
          }).addTo(map);

          map.fitBounds(riverLayer.getBounds());

          extractRiverCoordinates(data);

          statusText.textContent = "River loaded successfully.";

          await loadSelectedLayer();
        })
        .catch((error) => {
          console.error(error);
          statusText.textContent = "Error loading oldman_river.geojson.";
        });

      layerSelect.addEventListener("change", loadSelectedLayer);
      datePicker.addEventListener("change", loadSelectedLayer);
      modelFilter.addEventListener("change", loadSelectedLayer);

      markerSize.addEventListener("input", () => {
        markerSizeText.textContent = markerSize.value;
        loadSelectedLayer();
      });
    </script>
  </body>
</html>
